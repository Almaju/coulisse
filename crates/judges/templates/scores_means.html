{% if rows.is_empty() %}
  <span class="muted" style="font-size: 12px; font-style: italic">no scores yet</span>
{% else %}
  <div class="table-card">
    <div class="table-scroll">
      <table class="table">
        <thead>
          <tr>
            <th>Agent</th>
            <th class="num">Samples</th>
            <th class="num">Mean</th>
          </tr>
        </thead>
        <tbody>
          {% for r in rows %}
            <tr>
              <td class="mono">{{ r.agent }}</td>
              <td class="num mono">{{ r.samples }}</td>
              <td class="num mono" style="font-weight: 500">{{ r.mean }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endif %}
