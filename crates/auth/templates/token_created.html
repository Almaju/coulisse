<div class="card-velvet" style="margin-bottom: 20px; padding: 18px 20px">
  <div class="eyebrow" style="margin-bottom: 8px">Token created</div>
  <p style="color: var(--velvet-ink); font-size: 13px; margin: 0 0 10px">
    Secret for <span class="mono">{{ label }}</span> — copy it now, it won't be shown again.
  </p>
  <div style="align-items: flex-start; display: flex; gap: 10px">
    <pre class="code-block" style="border: 1px solid var(--velvet-line-2); flex: 1; user-select: all; white-space: pre-wrap; word-break: break-all">{{ secret }}</pre>
    <button
      type="button"
      class="btn btn-sm"
      onclick="navigator.clipboard.writeText('{{ secret }}')"
    >Copy</button>
  </div>
  <p style="font-size: 12px; margin: 12px 0 0">
    <a href="/admin/tokens" style="color: var(--orchid-soft)" hx-get="/admin/tokens" hx-target="#main" hx-push-url="true">Refresh the list →</a>
  </p>
</div>
