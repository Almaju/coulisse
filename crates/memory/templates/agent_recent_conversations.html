{% if conversations.is_empty() %}
  <span class="muted" style="font-size: 12px; font-style: italic">No conversations yet</span>
{% else %}
  <div class="section-gap" style="gap: 8px">
  {% for c in conversations %}
    <a href="/admin/conversations/{{ c.user_id }}"
       class="card-inset"
       style="align-items: center; color: inherit; display: flex; gap: 10px; justify-content: space-between; padding: 9px 12px; text-decoration: none">
      <span class="mono" style="font-size: 12px">{{ c.user_id_short }}</span>
      <span class="mono muted" style="font-size: 11.5px">{{ c.message_count }} msgs · {{ c.last_activity_at }}</span>
    </a>
  {% endfor %}
  </div>
{% endif %}
