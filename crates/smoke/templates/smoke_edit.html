<a href="/admin/smoke" class="back-link">← Smoke tests</a>

<div class="page-head" style="margin-top: 12px">
  <div>
    <h1 class="page-title">{% if is_new %}New smoke test{% else %}Edit {{ name }}{% endif %}</h1>
    <p class="page-sub">
      Edits write to the database; the YAML file is never modified.
      Validation runs before save; invalid changes are rejected.
    </p>
  </div>
</div>

<form
  hx-{{ method }}="{{ action }}"
  hx-ext="yaml-enc"
  hx-target="#smoke-edit-error"
  hx-swap="innerHTML"
  hx-on::after-request="if (event.detail.successful) { this.reset() }"
>
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">YAML body</div>
      <span class="mono muted" style="font-size: 11px">name · target · persona (provider · model · preamble)</span>
    </div>
    <div class="card-pad">
      <textarea
        name="__yaml"
        rows="20"
        spellcheck="false"
        class="textarea textarea-code"
      >{{ yaml }}</textarea>
    </div>
  </div>
  <div id="smoke-edit-error" class="form-error"></div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% if is_new %}/admin/smoke{% else %}/admin/smoke/{{ name }}{% endif %}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
