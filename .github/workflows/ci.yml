name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      # rabot fmt --check (the sorting rules) and rabot check --strict
      # (every other rule, warnings included). The release is installed
      # with rabot's own install script rather than the almaju/rabot
      # action, whose action.yml does not parse (an unquoted `default:`
      # inside a description). Keep RABOT_VERSION in step with the tag
      # in `just install` when bumping.
      - name: Install rabot
        env:
          RABOT_VERSION: v0.1.4
          RABOT_INSTALL: /home/runner/.cargo/bin
        run: curl -fsSL https://raw.githubusercontent.com/almaju/rabot/v0.1.4/install.sh | sh

      - name: rabot fmt --check
        run: rabot fmt --check

      - name: rabot check --strict
        run: rabot check --strict

      - name: cargo machete
        run: cargo machete --with-metadata

      - name: cargo test
        run: cargo test --all --locked
