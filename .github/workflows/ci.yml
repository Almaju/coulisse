name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      # rabot fmt --check (the sorting rules) and rabot check --strict
      # (every other rule, warnings included). The action installs the
      # pinned release and runs both. Keep `version` in step with the
      # action ref and the tag in `just install` when bumping.
      - name: rabot
        uses: almaju/rabot@v0.1.4
        with:
          version: v0.1.4

      - name: cargo machete
        run: cargo machete --with-metadata

      - name: cargo test
        run: cargo test --all --locked
