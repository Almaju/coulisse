<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Coulisse studio</title>
        <link rel="stylesheet" href="/admin/static/coulisse.css" />
        <script src="/admin/static/htmx.min.js"></script>
    </head>
    <body hx-boost="true" hx-target="#main" hx-swap="innerHTML">
        <div class="app">
            <aside class="sidebar">
                <a href="/admin/overview" class="brand">
                    <span class="arch">C</span>
                    <span class="brand-name">Coulisse</span>

                <nav>
                    <div class="navgroup">Build</div>
                    <a href="/admin/overview" class="nav-link"><span class="nav-glyph">◧</span> Home</a>
                    <a href="/admin/agents" class="nav-link"><span class="nav-glyph">◇</span> Agents</a>
                    <a href="/admin/mcp" class="nav-link"><span class="nav-glyph">⊞</span> MCP servers</a>
                    <div class="navgroup">Evaluate</div>
                    <a href="/admin/experiments" class="nav-link"><span class="nav-glyph">⚖</span> Experiments</a>
                    <a href="/admin/judges" class="nav-link"><span class="nav-glyph">◈</span> Judges</a>
                    <a href="/admin/smoke" class="nav-link"><span class="nav-glyph">✓</span> Smoke tests</a>

                    <a href="/admin/live" class="nav-link"><span class="nav-glyph">◉</span> Live</a>

                <div class="sidebar-foot mono">coulisse · backstage</div>
            </aside>
            <header class="mobile-head">
                <a href="/admin/overview" class="brand" style="padding: 0">
                    <span class="arch">C</span>
                    <span class="brand-name">Coulisse</span>
                </a>
                <button type="button" class="nav-toggle" aria-label="Toggle navigation">☰</button>
            </header>
            <div class="main-wrap">
                <main id="main">{{ content|safe }}</main>
            </div>
        </div>
        <div id="toasts"></div>
        <script src="/admin/static/app.js" defer></script>
