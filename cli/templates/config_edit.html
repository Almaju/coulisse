<a href="/admin/settings" class="back-link">← Settings</a>

<div class="page-head" style="margin-top: 12px">
  <div>
    <h1 class="page-title">Raw configuration</h1>
    <p class="page-sub">
      The entire <code>coulisse.yaml</code> file. Saving replaces it
      atomically; the whole config is validated before anything touches disk, so an invalid
      edit is rejected and the running config is left untouched.
    </p>
  </div>
</div>

<form
  hx-put="/admin/config"
  hx-ext="yaml-enc"
  hx-target="#config-edit-error"
  hx-swap="innerHTML"
>
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">coulisse.yaml</div>
      <span class="mono muted" style="font-size: 11px">validated before save</span>
    </div>
    <div class="card-pad">
      <textarea
        name="__yaml"
        rows="32"
        spellcheck="false"
        class="textarea textarea-code"
      >{{ yaml }}</textarea>
    </div>
  </div>
  <div id="config-edit-error" class="form-error"></div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/settings" class="btn btn-ghost">Cancel</a>
  </div>
</form>
