<a href="/admin/settings" class="back-link">← Settings</a>

<div class="page-head" style="margin-top: 12px">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-sub">{{ hint }}</p>
  </div>
</div>

<form
  hx-put="{{ action }}"
  hx-ext="yaml-enc"
  hx-target="#section-edit-error"
  hx-swap="innerHTML"
>
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">YAML body</div>
    </div>
    <div class="card-pad">
      <textarea
        name="__yaml"
        rows="18"
        spellcheck="false"
        class="textarea textarea-code"
      >{{ yaml }}</textarea>
    </div>
  </div>
  <div id="section-edit-error" class="form-error"></div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/settings" class="btn btn-ghost">Cancel</a>
  </div>
</form>
